[package]
name = "protonaut"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Wayland game launcher that runs Windows games through umu-launcher"
license = "MIT"
readme = "README.md"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
libc = "0.2"
# значок окна: свой PNG-декодер вместо feature `image` у iced — там в
# зависимостях AVIF-декодер (rav1e с rayon), а нужен один RGBA-буфер
png = "0.17"
# загрузка релизов Proton: HTTPS без системных CA (корни webpki), распаковка, хеши
ureq = "2"
serde_json = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
# системный выбор файла через XDG Desktop Portal (org.freedesktop.portal.FileChooser),
# то есть через тот же диалог, что и у всех приложений в сессии; tokio-бэкенд —
# потому что сам лаунчер крутится на tokio
ashpd = { version = "0.13", features = ["file_chooser"] }

[profile.release]
lto = "thin"
